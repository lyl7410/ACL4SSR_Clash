[custom]
; Personal Advanced 2026-10-15 - conversion template, not Mihomo YAML
enable_rule_generator=true
overwrite_original_rules=true
clash_rule_base=https://raw.githubusercontent.com/lyl7410/ACL4SSR_Clash/main/Clash/config/Personal_Advanced_base.yaml



; 1. 本地连接和网站验证
; 局域网直接连接；网站的人机验证使用普通代理。
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🚀 节点选择,[]DOMAIN,challenges.cloudflare.com

; 2. 拦截广告
; 只使用两份基础广告清单。
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list

; 3. AI 服务
; ChatGPT、Claude、Gemini、Copilot 等优先匹配，避免被后面的规则分走。
ruleset=🤖 AI,[]DOMAIN-SUFFIX,chatgpt.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,oaistatic.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,oaiusercontent.com
ruleset=🤖 AI,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/openai.list
ruleset=🤖 AI,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/anthropic.list
ruleset=🤖 AI,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/google-gemini.list
ruleset=🤖 AI,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/github-copilot.list
ruleset=🤖 AI,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/xai.list
ruleset=🤖 AI,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/bing.list

; 4. 下载模型
; 先匹配可以直连的 R2 文件，再处理模型网站、其他下载源和 StabilityMatrix。
ruleset=⚡ R2直连加速,https://raw.githubusercontent.com/lyl7410/ACL4SSR_Clash/main/rule/Personal/R2Direct.list
ruleset=📦 模型下载,https://raw.githubusercontent.com/lyl7410/ACL4SSR_Clash/main/rule/Personal/ModelDownload.list

; 5. 看直播、用谷歌、聊天和听音乐
; 分别交给油管视频、谷歌服务、社媒和国际媒体组。
ruleset=📹 油管视频,[]DOMAIN-SUFFIX,holodex.net
ruleset=📹 油管视频,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list
ruleset=🔍 谷歌服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GoogleFCM/GoogleFCM.list
ruleset=🔍 谷歌服务,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list
ruleset=📲 电报与社媒,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=📲 电报与社媒,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Twitter/Twitter.list
ruleset=🎬 国际媒体,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.list

; 6. 开发网站和其他国外视频
; GitHub 等开发网站走节点选择；Netflix、TikTok 等走国际媒体。
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Developer/Developer.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list
