# Mihomo override/merge fragment, NOT a standalone proxy subscription.
# Pair with Personal_Advanced.ini. dns.use-system-hosts belongs under dns.
# Optional verified Hosts only: replace hosts: {} with YOUR tested IP.
# Example format (disabled): hosts: {civitai.delivery: 104.18.32.47}
# Never assume example IPs are currently valid/fast or suitable for every R2 hostname.
find-process-mode: strict
tcp-concurrent: true
unified-delay: true
keep-alive-idle: 15
keep-alive-interval: 15
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true
hosts: {}
dns:
  enable: true
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - +.lan
  - +.local
  - +.home.arpa
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.civitai.com
  - +.civitai.red
  - +.civitai.delivery
  - +.civitai.tv
  - +.civitai.link
  - +.r2.cloudflarestorage.com
  - +.huggingface.co
  - +.hf.co
  - +.hf.space
  - +.xethub.hf.co
  - +.githubusercontent.com
  - +.download.pytorch.org
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    +.openai.com: https://1.1.1.1/dns-query#🤖 AI
    +.chatgpt.com: https://1.1.1.1/dns-query#🤖 AI
    +.anthropic.com: https://1.1.1.1/dns-query#🤖 AI
    +.claude.ai: https://1.1.1.1/dns-query#🤖 AI
    +.gemini.google.com: https://1.1.1.1/dns-query#🤖 AI
    +.generativelanguage.googleapis.com: https://1.1.1.1/dns-query#🤖 AI
    +.civitai.com: https://1.1.1.1/dns-query#📦 模型下载
    +.civitai.red: https://1.1.1.1/dns-query#📦 模型下载
    +.huggingface.co: https://1.1.1.1/dns-query#📦 模型下载
    +.hf.co: https://1.1.1.1/dns-query#📦 模型下载
    +.civitai.delivery:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    +.r2.cloudflarestorage.com:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: false
    TLS:
      ports:
      - 443
      - 8443
      override-destination: false
    QUIC:
      ports:
      - 443
      - 8443
      override-destination: false
